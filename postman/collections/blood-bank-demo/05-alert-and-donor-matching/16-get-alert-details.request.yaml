$kind: http-request
name: '16 Get Alert Details'
method: GET
url: '{{base_url}}/alerts/{{alert_id}}'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{hospital_jwt}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Verify alert details are retrievable
      pm.test("Returns 200 with alert details", function () {
          pm.response.to.have.status(200);
      });
