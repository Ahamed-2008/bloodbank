$kind: http-request
name: '22 Donor A - Donation History'
method: GET
url: '{{base_url}}/donations/history'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{donor_a_jwt}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Verify the completed donation appears in history
      pm.test("Returns 200 with donation history", function () {
          pm.response.to.have.status(200);
      });
