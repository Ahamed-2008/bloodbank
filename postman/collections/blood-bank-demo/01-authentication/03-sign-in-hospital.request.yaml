$kind: http-request
name: '03 Sign In - Hospital Staff'
method: POST
url: '{{base_url}}/auth/sign-in'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "idToken": "{{firebase_token_hospital}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Verify sign-in succeeded and save hospital staff JWT
      pm.test("Returns 200 and saves hospital_jwt", function () {
          pm.response.to.have.status(200);
          const json = pm.response.json();
          pm.environment.set("hospital_jwt", json.access_token);
      });
